<!doctype html>

<script>/* 저장한 화면 모드를 바로 적용 (깜빡임 방지) */try{var v=JSON.parse(localStorage.getItem('voicebox.view')||'{}'),d=document.documentElement;if(v.theme==='light'||v.theme==='dark')d.dataset.theme=v.theme;if(v.palette==='green'||v.palette==='mono')d.dataset.palette=v.palette;if(v.coverBlur)d.classList.add('cover-blur');d.lang=v.menuLang==='ja'?'ja':v.menuLang==='en'?'en':'ko'}catch(e){}</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="app" id="app">

 <!-- 왼쪽 메뉴 -->
 <nav class="sidebar" id="sidebar" aria-label="정리함">
  <a class="brand" href="#" id="homeLink"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="var(--accent)"/><rect x="28" y="18" width="50" height="64" rx="8" fill="var(--surface)"/><path d="M28 29h-6M28 41h-6M28 53h-6M28 65h-6" stroke="var(--surface)" stroke-width="4" stroke-linecap="round"/><rect x="45" y="30" width="16" height="24" rx="8" fill="var(--accent)"/><path d="M53 35.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="var(--surface)"/><path d="M40 48a13 13 0 0 0 26 0M53 61v8M47 69h12" fill="none" stroke="var(--accent)" stroke-width="3.6" stroke-linecap="round"/></svg>VOICE BOX</a>
  <div class="nav-group">
   <div class="nav-title" data-menu="g-library">정리함</div>
   <div id="navMain"></div>
  </div>
  <div class="nav-group">
   <div class="nav-title" data-menu="g-notion">노션</div>
   <div id="navNotion"></div>
  </div>
  <div class="nav-group">
   <div class="nav-title nav-title-row"><span data-menu="g-folders">내 폴더</span> <button class="link-btn" id="newFolder" type="button" data-menu="new-folder">+ 새 폴더</button></div>
   <div id="navFolders"></div>
  </div>
  <div class="sidebar-foot">
   <button class="ghost-btn" id="openSettings" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    <span data-menu="settings">설정 · 노션 · 백업</span>
   </button>
   <div class="sync-line" id="syncLine"></div>
  </div>
 </nav>

 <!-- 가운데 목록 -->
 <main class="main" id="main">
  <header class="main-head">
   <div class="title-row">
    <h1 id="viewTitle">전체 작품</h1><span class="count" id="viewCount"></span>
    <div class="hd-tools" role="group" aria-label="보기 형식">
     <button class="hd-btn" id="hdHidden" type="button" aria-pressed="false" aria-label="숨긴 작품 보기" title="숨긴 작품 보기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
     <button class="hd-btn" data-view="list" type="button" aria-label="목록 보기" title="목록 보기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
     <button class="hd-btn" data-view="grid" type="button" aria-label="표지 보기" title="표지 보기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
     <button class="hd-btn view-opt-btn" id="viewOptBtn" type="button" aria-label="필터" title="필터"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="opt-badge" id="viewOptBadge" hidden></span></button>
    </div>
    <button class="primary-btn" id="addWork" type="button" data-menu="add">+ 작품 추가</button>
   </div>
   <div class="nav-chips" id="navChips" role="tablist" aria-label="정리함"></div>
   <div class="search-row"><label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input id="search" type="search" placeholder="작품명, 성우, 서클, 태그, 코드, 감상" autocomplete="off" enterkeyhint="search">
   </label>
   <button type="button" class="search-cancel" id="searchCancel" data-ui="cancel">취소</button></div>
   <div class="filters">
    <select id="fActor" aria-label="성우"><option value="">성우 · 전체</option></select>
    <select id="fCircle" aria-label="서클"><option value="">서클 · 전체</option></select>
    <select id="fTag" aria-label="장르"><option value="">장르 · 전체</option></select>
    <select id="fRating" aria-label="별점">
     <option value="">별점 · 전체</option><option value="5">★5</option><option value="4">★4 이상</option><option value="3">★3 이상</option><option value="0">별점 없음</option>
    </select>
    <select id="fWorkType" aria-label="구분"><option value="">구분 · 전체</option><option value="동인">동인</option><option value="상업">상업</option></select>
    <button class="tool-btn filter-btn" id="filterBtn" type="button">필터</button>
    <select id="fSort" aria-label="정렬">
     <option value="bought" selected>구매일 최신순</option>
     <option value="updated">최근 수정순</option>
     <option value="created">등록순</option>
     <option value="date">발매일 최신순</option>
     <option value="dateOld">발매일 오래된순</option>
     <option value="rating">별점 높은순</option>
     <option value="played">최근 들은순</option>
     <option value="title">제목순</option>
    </select>
    <button class="link-btn" id="resetFilters" type="button" hidden>필터 초기화</button>
    <button class="tool-btn icon-only" id="toggleHidden" type="button" aria-pressed="false" title="숨긴 작품도 목록에 보기" aria-label="숨긴 작품 보기">
     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
    <button class="tool-btn icon-only" id="toggleBlur" type="button" aria-pressed="false" title="표지 가리기" aria-label="표지 가리기">
     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M3 15l5-5 4 4 3-3 6 6"></path><path d="M4 4l16 16"></path></svg>
    </button>
    <div class="view-switch" role="group" aria-label="보기 형식">
     <button type="button" data-view="list" aria-label="목록 보기" title="목록 보기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></button>
     <button type="button" data-view="grid" aria-label="표지 보기" title="표지 보기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></button>
    </div>
   </div>
  </header>
  <section class="search-suggest" id="searchSuggest" hidden></section>
  <section class="home" id="home" hidden></section>
  <section class="stats" id="stats" hidden></section>
  <div class="list" id="list" role="list"></div>
  <div class="list-more" id="listMore"></div>
 </main>

 <!-- 칸막이: 끌어서 상세 폭 조절 -->
 <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="목록과 상세 사이 칸막이 (끌어서 폭 조절, 두 번 누르면 기본 폭)" tabindex="0" title="끌어서 폭 조절 · 두 번 누르면 기본 폭" hidden></div>
 <!-- 오른쪽 상세 -->
 <aside class="detail" id="detail" aria-label="작품 상세" hidden></aside>
</div>

<!-- 폰 하단 탭 -->
<nav class="tabbar" id="tabbar" aria-label="메뉴">
 <button type="button" data-tab="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h4.5v-6h4v6h4.5V9"/></svg><span data-menu="tab-home">홈</span></button>
 <button type="button" data-tab="list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.6"/></svg><span data-menu="tab-list">목록</span></button>
 <button type="button" data-tab="add" class="tab-add" aria-label="작품 추가"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
 <button type="button" data-tab="stats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 1 1 11 3.5V13z"/><path d="M14.5 3.7a8.5 8.5 0 0 1 5.8 5.8h-5.8z"/></svg><span data-menu="tab-stats">통계</span></button>
 <button type="button" data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-menu="tab-settings">설정</span></button>
</nav>
<div class="scrim" id="scrim" hidden></div>

<!-- 편집 -->
<dialog class="modal modal-wide" id="editor"></dialog>
<!-- 노션 반영 -->
<dialog class="modal" id="pushDialog"></dialog>
<!-- 설정 -->
<dialog class="modal" id="settings"></dialog>
<!-- 수정 이력 -->
<dialog class="modal" id="historyDialog"></dialog>
<!-- 이미지 크게 보기 -->
<dialog class="lightbox" id="lightbox"></dialog>
<!-- 좁은 창 필터 -->
<dialog class="modal modal-small" id="filterSheet"></dialog>
<dialog class="act-sheet" id="actSheet"></dialog>
<!-- 간단 입력 -->
<dialog class="modal modal-small" id="promptDialog"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.VB_MOBILE = true; window.VB_CARD_URL = 'reviewcard.html';</script>
<script type="module" src="local-api.js"></script>
<script defer src="i18n.js"></script>
<script defer src="markdown.js"></script>
<script defer src="app.js"></script>
<script type="module" src="mobile.js"></script>
</body>
</html>
